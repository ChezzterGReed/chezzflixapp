[package]
name = "chezzflix"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chezzflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "native-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "android")'.dependencies]
# Android has no system OpenSSL for Rust to link, so build one in.
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "native-tls-vendored"] }
