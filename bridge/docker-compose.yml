services:
  chezzflix-bridge:
    build: .
    container_name: chezzflix-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PLEX_URL: ${PLEX_URL}              # e.g. http://192.168.1.20:32400 (the address of Plex as seen from this container)
      PLEX_TOKEN: ${PLEX_TOKEN}
      BRIDGE_USER: ${BRIDGE_USER:-chezzflix}
      BRIDGE_PASS: ${BRIDGE_PASS}        # pick something long; it is also part of every stream address
      # BRIDGE_LIBRARIES: "Movies,TV Shows"   # leave out to share every movie and show library
